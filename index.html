<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobalBank World Clock</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #eef6ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #12345b 0%, #07111f 55%, #030712 100%);
    }
    main { width: min(960px, 100%); }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3.5rem); }
    p { color: #a9bdd3; margin: 0; }
    .toolbar { display: flex; gap: 12px; margin: 24px 0; flex-wrap: wrap; }
    select, button {
      border: 1px solid #294767;
      border-radius: 10px;
      background: #0d2036;
      color: inherit;
      padding: 11px 14px;
      font: inherit;
    }
    button { cursor: pointer; background: #1769aa; border-color: #2b8bd1; }
    button:hover { background: #2181c9; }
    .clocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .clock {
      padding: 22px;
      border: 1px solid #21405e;
      border-radius: 18px;
      background: rgba(13, 32, 54, .86);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
    }
    .clock h2 { margin: 0 0 10px; font-size: 1.15rem; }
    .zone { color: #89b5d8; font-size: .85rem; min-height: 2.4em; }
    .time { margin: 16px 0 7px; font-variant-numeric: tabular-nums; font-size: clamp(2rem, 6vw, 3.3rem); letter-spacing: .04em; }
    .date { color: #b7c8d9; }
    .empty { padding: 32px; border: 1px dashed #41617d; border-radius: 16px; color: #a9bdd3; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GlobalBank World Clock</h1>
      <p>View the current time across important global banking locations.</p>
    </header>

    <div class="toolbar" aria-label="Clock controls">
      <label>
        <span class="sr-only">Add a time zone</span>
        <select id="timezone">
          <option value="America/New_York">New York</option>
          <option value="America/Los_Angeles">Los Angeles</option>
          <option value="Europe/London">London</option>
          <option value="Europe/Zurich">Zurich</option>
          <option value="Asia/Dubai">Dubai</option>
          <option value="Asia/Singapore">Singapore</option>
          <option value="Asia/Tokyo">Tokyo</option>
          <option value="Australia/Sydney">Sydney</option>
        </select>
      </label>
      <button id="add" type="button">Add time zone</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <section id="clocks" class="clocks" aria-live="polite"></section>
  </main>

  <script>
    const defaults = [
      ['New York', 'America/New_York'],
      ['London', 'Europe/London'],
      ['Dubai', 'Asia/Dubai'],
      ['Singapore', 'Asia/Singapore'],
      ['Tokyo', 'Asia/Tokyo']
    ];
    let zones = [...defaults];
    const clockList = document.querySelector('#clocks');
    const selector = document.querySelector('#timezone');

    function locationName(zone) {
      return zone.split('/').pop().replaceAll('_', ' ');
    }

    function render() {
      if (!zones.length) {
        clockList.innerHTML = '<div class="empty">No time zones selected.</div>';
        return;
      }
      clockList.innerHTML = zones.map(([name, zone]) => `
        <article class="clock">
          <h2>${name}</h2>
          <div class="zone">${zone}</div>
          <div class="time" data-zone="${zone}">--:--:--</div>
          <div class="date" data-date-zone="${zone}">Loading date…</div>
        </article>
      `).join('');
      update();
    }

    function update() {
      const now = new Date();
      document.querySelectorAll('[data-zone]').forEach((element) => {
        element.textContent = new Intl.DateTimeFormat(undefined, {
          timeZone: element.dataset.zone,
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).format(now);
      });
      document.querySelectorAll('[data-date-zone]').forEach((element) => {
        element.textContent = new Intl.DateTimeFormat(undefined, {
          timeZone: element.dataset.dateZone,
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        }).format(now);
      });
    }

    document.querySelector('#add').addEventListener('click', () => {
      const zone = selector.value;
      if (!zones.some((item) => item[1] === zone)) {
        zones.push([locationName(zone), zone]);
        render();
      }
    });
    document.querySelector('#reset').addEventListener('click', () => {
      zones = [...defaults];
      render();
    });

    render();
    setInterval(update, 1000);
  </script>
</body>
</html>
